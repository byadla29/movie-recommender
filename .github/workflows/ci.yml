name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: user-service, role: user_svc, db: user_db, pw_var: USER_SVC_DB_PASSWORD }
          - { service: catalog-service, role: catalog_svc, db: catalog_db, pw_var: CATALOG_SVC_DB_PASSWORD }
          - { service: recommendation-service, role: reco_svc, db: reco_db, pw_var: RECO_SVC_DB_PASSWORD }
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest tests/unit
      - name: Start Postgres (throwaway passwords, CI only)
        working-directory: .
        run: |
          python3 -c "import secrets
          for k in ['POSTGRES_PASSWORD','USER_SVC_DB_PASSWORD','CATALOG_SVC_DB_PASSWORD','RECO_SVC_DB_PASSWORD']:
              print(f'{k}={secrets.token_urlsafe(24)}')" > .env
          docker compose up -d --wait postgres
      - name: Integration tests (migrations, readiness, database isolation)
        run: |
          set -a; . ../../.env; set +a
          export RUN_INTEGRATION=1
          export DATABASE_URL="postgresql+psycopg://${{ matrix.role }}:${${{ matrix.pw_var }}}@127.0.0.1:5433/${{ matrix.db }}"
          uv run pytest tests/integration

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - name: OpenAPI contracts match code
        run: bash scripts/export-openapi.sh --check
      - name: Vocabularies are valid
        run: python3 scripts/check_vocab.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-services, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build all images
        run: |
          cp .env.example .env
          docker compose build
