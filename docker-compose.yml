# Local development stack. Usage: cp .env.example .env (set passwords) && docker compose up --build
# All ports are bound to 127.0.0.1 only. Backend ports are published for Swagger/debugging;
# in the real architecture only the frontend is public.
name: movie-reco

x-python-service: &python-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      USER_SVC_DB_PASSWORD: ${USER_SVC_DB_PASSWORD:?set USER_SVC_DB_PASSWORD in .env}
      CATALOG_SVC_DB_PASSWORD: ${CATALOG_SVC_DB_PASSWORD:?set CATALOG_SVC_DB_PASSWORD in .env}
      RECO_SVC_DB_PASSWORD: ${RECO_SVC_DB_PASSWORD:?set RECO_SVC_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432" # 5433 avoids clashing with a locally installed Postgres
    healthcheck:
      # -h 127.0.0.1 matters: during first-run init the server listens only on a Unix socket,
      # so a TCP check stays unhealthy until the init scripts have finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  user-service:
    <<: *python-service
    build: ./services/user-service
    environment:
      SERVICE_NAME: user-service
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://user_svc:${USER_SVC_DB_PASSWORD}@postgres:5432/user_db
      RUN_MIGRATIONS_ON_START: "true"
    ports:
      - "127.0.0.1:8001:8000"

  catalog-service:
    <<: *python-service
    build: ./services/catalog-service
    environment:
      SERVICE_NAME: catalog-service
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://catalog_svc:${CATALOG_SVC_DB_PASSWORD}@postgres:5432/catalog_db
      RUN_MIGRATIONS_ON_START: "true"
    ports:
      - "127.0.0.1:8002:8000"

  recommendation-service:
    <<: *python-service
    build: ./services/recommendation-service
    environment:
      SERVICE_NAME: recommendation-service
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://reco_svc:${RECO_SVC_DB_PASSWORD}@postgres:5432/reco_db
      RUN_MIGRATIONS_ON_START: "true"
    ports:
      - "127.0.0.1:8003:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Public value; needed at build time (see frontend/Dockerfile). From the root .env.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    # Clerk keys at RUN time (incl. CLERK_SECRET_KEY) come from the git-ignored
    # frontend/.env.local, so the secret never ends up inside the image.
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      USER_SERVICE_URL: http://user-service:8000
      CATALOG_SERVICE_URL: http://catalog-service:8000
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8000
    ports:
      - "127.0.0.1:3000:3000"
    # Starts even if a service is unhealthy: the BFF must degrade gracefully, not refuse to boot.
    depends_on:
      - user-service
      - catalog-service
      - recommendation-service

volumes:
  pgdata:
