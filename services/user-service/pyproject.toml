[project]
name = "user-service"
version = "0.1.0"
description = "Profiles, region/language/genre preferences, consents and watchlists."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real Postgres (set RUN_INTEGRATION=1)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["S"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
